[project]
name = "ai-taxman"
version = "0.0.1"
description = "AI tax man — placeholder release reserving the name. Coming soon."
readme = "README.md"
authors = [
    { name = "Matthew DeVerna", email = "matthew.deverna@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["ai", "placeholder"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/mr-devs/ai-taxman"
Repository = "https://github.com/mr-devs/ai-taxman"
Issues = "https://github.com/mr-devs/ai-taxman/issues"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
