[project]
name = "ai-taxman"
version = "0.0.2"
description = "A simple command line interface to audit popular AI systems, importable as a Python package."
readme = "README.md"
authors = [
    { name = "Matthew DeVerna", email = "matthew.deverna@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.15",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "questionary>=2.1.1",
]
keywords = [
    "ai",
    "audit",
    "auditing",
    "algorithm-audit",
    "evaluation",
    "llm",
    "accountability",
    "transparency",
    "cli",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
openai = ["openai>=1.60"]
anthropic = ["anthropic>=0.40"]
all = ["ai-taxman[openai,anthropic]"]

[project.scripts]
taxman = "ai_taxman.cli:app"

[project.urls]
Homepage = "https://github.com/mr-devs/ai-taxman"
Repository = "https://github.com/mr-devs/ai-taxman"
Issues = "https://github.com/mr-devs/ai-taxman/issues"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits real provider APIs; deselected by default",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["ai_taxman.providers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Ships no type information of its own.
module = ["shellingham.*"]
ignore_missing_imports = true

