[project]
name = "ai-taxman"
version = "0.0.2"
description = "A simple command line interface to audit popular AI systems, importable as a Python package."
readme = "README.md"
authors = [
    { name = "Matthew DeVerna", email = "matthew.deverna@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = [
    "ai",
    "audit",
    "auditing",
    "algorithm-audit",
    "evaluation",
    "llm",
    "accountability",
    "transparency",
    "cli",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/mr-devs/ai-taxman"
Repository = "https://github.com/mr-devs/ai-taxman"
Issues = "https://github.com/mr-devs/ai-taxman/issues"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
